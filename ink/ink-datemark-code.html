<script>
(()=>{'use strict';
  const source=document.getElementById('source');
  const generate=document.getElementById('generate');
  const clear=document.getElementById('clear');
  const copy=document.getElementById('copy');
  const dateOverlay=document.getElementById('date-overlay');
  const randomButton=document.getElementById('random-mode');
  const matrix=document.getElementById('matrix');
  const output=document.getElementById('matrix-text');
  const status=document.getElementById('status-text');
  const modeButton=document.getElementById('color-mode');
  const glyphs=['▗','▖','▄','▝','▐','▞','▟','▘','▚','▌','▙','▀','▜','▛','█'];
  const colors=['#FFFFFF','#808080','#6E927C','#00FFFF','#00FF00','#FF00FF','#FF0000','#FFFF00'];
  let digits='';
  let colorful=true;
  let lastDate='';
  let colorIndexes=[];
  let randomMode=false;
  let randomPending=false;
  let previousManualDigits='';
  function updateGenerateLabel(){
    generate.textContent=randomMode?(lastDate?'再隨機':'隨機'):(lastDate?'再演算':'演算');
  }

  // Separators are display-only: digits is always an eight-digit YYYYMMDD string.
  function displayDate(raw){
    if(raw.length<4)return raw;
    if(raw.length<6)return raw.slice(0,4)+'-'+raw.slice(4);
    if(raw.length===6)return raw.slice(0,4)+'-'+raw.slice(4)+'-';
    return raw.slice(0,4)+'-'+raw.slice(4,6)+'-'+raw.slice(6);
  }
  function caretForDigits(value,count){
    if(count<=0)return 0;
    let seen=0;
    for(let i=0;i<value.length;i++){
      if(/[0-9]/.test(value[i]))seen++;
      if(seen===count){let position=i+1;while(value[position]==='-')position++;return position;}
    }
    return value.length;
  }
  function assignDate(raw,caretDigits){
    digits=raw.replace(/\D/g,'').slice(0,8);
    const formatted=displayDate(digits);
    source.value=formatted;
    const caret=caretForDigits(formatted,Math.min(caretDigits,digits.length));
    source.setSelectionRange(caret,caret);
    updateDateOverlay();
  }
  source.addEventListener('input',()=>{
    if(randomMode)return;
    const current=source.value;
    const before=current.slice(0,source.selectionStart??current.length).replace(/\D/g,'').length;
    assignDate(current,before);
  });
  source.addEventListener('keydown',event=>{
    if(event.key==='Enter'){event.preventDefault();generate.click();return;}
    if(randomMode)return;
    if(event.key!=='Backspace'&&event.key!=='Delete')return;
    const start=source.selectionStart??0,end=source.selectionEnd??0;
    if(start!==end)return;
    const text=source.value;
    const atSeparator=event.key==='Backspace'?text[start-1]==='-':text[start]==='-';
    if(!atSeparator)return;
    event.preventDefault();
    const before=text.slice(0,start).replace(/\D/g,'').length;
    const removeIndex=event.key==='Backspace'?before-1:before;
    if(removeIndex>=0&&removeIndex<digits.length){
      assignDate(digits.slice(0,removeIndex)+digits.slice(removeIndex+1),removeIndex);
    }
  });

  function validDate(value){
    if(!/^\d{8}$/.test(value))return false;
    const year=Number(value.slice(0,4)),month=Number(value.slice(4,6)),day=Number(value.slice(6));
    if(year<1||month<1||month>12)return false;
    return day>=1&&day<=daysInMonth(year,month);
  }
  function daysInMonth(year,month){
    const leap=year%4===0&&(year%100!==0||year%400===0);
    return [31,leap?29:28,31,30,31,30,31,31,30,31,30,31][month-1];
  }
  function updateDateOverlay(){
    if(randomMode&&randomPending){
      dateOverlay.textContent='????-??-??';
      source.setAttribute('aria-invalid','false');
      return;
    }
    const year=digits.slice(0,4),month=digits.slice(4,6),day=digits.slice(6,8);
    const monthNumber=Number(month);
    const validMonth=month.length===2&&monthNumber>=1&&monthNumber<=12;
    const maxDay=validMonth&&year.length===4&&Number(year)>0
      ?daysInMonth(Number(year),monthNumber)
      :validMonth?daysInMonth(2000,monthNumber):31;
    const invalidYear=year.length===4&&Number(year)===0;
    const invalidMonth=month.length===1?/^[2-9]$/.test(month)
      :month.length===2&&(monthNumber<1||monthNumber>12);
    const invalidDay=day.length===1
      ?Number(day)>Math.floor(maxDay/10)
      :day.length===2&&(Number(day)<1||Number(day)>maxDay);
    const parts=[
      [year,invalidYear],
      [month,invalidMonth],
      [day,invalidDay]
    ];
    const nodes=[];
    for(let i=0;i<parts.length;i++){
      const [value,invalid]=parts[i];
      if(i===1&&digits.length>=4)nodes.push(document.createTextNode('-'));
      if(i===2&&digits.length>=6)nodes.push(document.createTextNode('-'));
      if(value){
        const part=document.createElement('span');
        if(invalid)part.className='date-invalid';
        part.textContent=value;
        nodes.push(part);
      }
    }
    dateOverlay.replaceChildren(...nodes);
    source.setAttribute('aria-invalid',String(invalidYear||invalidMonth||invalidDay));
  }
  function setRandomMode(enabled){
    if(enabled===randomMode)return;
    randomMode=enabled;
    randomButton.textContent='random = '+(randomMode?'y':'n');
    randomButton.setAttribute('aria-pressed',String(randomMode));
    source.readOnly=randomMode;
    if(randomMode){
      previousManualDigits=digits;
      randomPending=true;
      source.value='????-??-??';
    }else if(randomPending){
      digits=previousManualDigits;
      source.value=displayDate(digits);
      randomPending=false;
    }else{
      source.value=displayDate(digits);
    }
    updateDateOverlay();
    updateGenerateLabel();
  }
  randomButton.addEventListener('click',()=>setRandomMode(!randomMode));
  function randomDate(){
    let result='';
    for(let tries=0;tries<5;tries++){
      const year=1+Math.floor(Math.random()*9999);
      const month=1+Math.floor(Math.random()*12);
      const day=1+Math.floor(Math.random()*daysInMonth(year,month));
      result=String(year).padStart(4,'0')+
        String(month).padStart(2,'0')+String(day).padStart(2,'0');
      if(result!==lastDate)break;
    }
    if(result===lastDate){
      const year=(Number(result.slice(0,4))%9999)+1;
      result=String(year).padStart(4,'0')+result.slice(4);
    }
    return result;
  }
  function hashDate(value){
    let hash=2166136261;
    for(const char of 'INK-DATEMARK-CODE-V5|'+value){
      hash=Math.imul(hash^char.charCodeAt(0),16777619);
    }
    return hash>>>0;
  }
  function makeGenerator(seed){
    let state=seed>>>0;
    return ()=>{
      state=(state+0x6D2B79F5)>>>0;
      let n=Math.imul(state^(state>>>15),state|1);
      n^=n+Math.imul(n^(n>>>7),n|61);
      return (n^(n>>>14))>>>0;
    };
  }
  function makeMatrix(value){
    // The pale glyph quadrants form the walls (1); the dark negative space
    // is the walkable maze (0). Never mirror cells.
    const width=64,length=width*width,seed=hashDate(value);
    const wall=new Uint8Array(length).fill(1);
    const next=makeGenerator(seed);
    const logicalWidth=31,logicalHeight=31,logicalCount=logicalWidth*logicalHeight;
    const visitedCells=new Uint8Array(logicalCount);
    const stack=new Int16Array(logicalCount);
    const carve=(x,y)=>{wall[y*width+x]=0;};
    const pixelForCell=(cx,cy)=>({x:1+cx*2,y:1+cy*2});
    const cellPixels=(x,y)=>{
      const p=(y*2)*width+(x*2);
      return [p,p+1,p+width,p+width+1];
    };

    // Two different boundary cells, on any of four sides. Both opening
    // glyphs are ▘ (only the upper-left quadrant is pale). Its three
    // adjacent dark quadrants allow a genuine connected opening on every side.
    // Corners are excluded to avoid an accidental opening on two sides.
    function pickOpening(){
      const side=next()%4,position=2+(next()%28);
      return {side,position,
        x:side===1?31:side===3?0:position,
        y:side===0?0:side===2?31:position};
    }
    const openings=[pickOpening(),pickOpening()];
    if(openings[0].x===openings[1].x&&openings[0].y===openings[1].y){
      const second=openings[1];
      second.position=2+((second.position-1)%28);
      if(second.side===0||second.side===2)second.x=second.position;
      else second.y=second.position;
    }
    function logicalAnchor(opening){
      switch(opening.side){
        case 0:return {x:opening.position,y:0};
        case 1:return {x:30,y:opening.position};
        case 2:return {x:opening.position,y:30};
        default:return {x:0,y:opening.position};
      }
    }

    // Recursive-backtracker / randomized DFS creates one connected network.
    // Every two-cell step carves its intermediate wall and never adds
    // a disconnected dark island.
    let depth=1,seen=1;
    const anchor=logicalAnchor(openings[0]);
    const firstIndex=anchor.y*logicalWidth+anchor.x;
    stack[0]=firstIndex;visitedCells[firstIndex]=1;
    const first=pixelForCell(anchor.x,anchor.y);
    carve(first.x,first.y);
    const directions=[[0,-1],[1,0],[0,1],[-1,0]];
    // These independent interior passages are reserved for the exact date
    // signature. Spread them throughout the maze rather than along one edge.
    const signatureBridges=[];
    const reserved=new Uint8Array(length);
    for(let i=0;i<32;i++){
      const cx=2+(i%4)*8,cy=2+Math.floor(i/4)*3;
      const pixel=(1+cy*2)*width+(2+cx*2);
      signatureBridges.push(pixel);
      reserved[pixel]=1;
    }
    while(depth){
      const here=stack[depth-1];
      const x=here%logicalWidth,y=(here/logicalWidth)|0;
      const choices=[];
      for(const [dx,dy] of directions){
        const nx=x+dx,ny=y+dy;
        if(nx>=0&&nx<logicalWidth&&ny>=0&&ny<logicalHeight&&!visitedCells[ny*logicalWidth+nx]){
          const between=(1+y*2+dy)*width+(1+x*2+dx);
          if(reserved[between])continue;
          choices.push([dx,dy,nx,ny]);
        }
      }
      if(!choices.length){depth--;continue;}
      const [dx,dy,nx,ny]=choices[next()%choices.length];
      const oldPoint=pixelForCell(x,y),newPoint=pixelForCell(nx,ny);
      carve(oldPoint.x+dx,oldPoint.y+dy);
      carve(newPoint.x,newPoint.y);
      const index=ny*logicalWidth+nx;
      visitedCells[index]=1;stack[depth++]=index;seen++;
    }
    if(seen!==logicalCount)throw new Error('DATEMARK UNVISITED CELL');

    // Keep only the outermost quadrant edge sealed. Extend existing paths
    // into the immediately adjacent bottom/right quadrants to avoid the
    // artificial two-pixel-wide frame from v4.
    for(let i=0;i<logicalWidth;i++){
      if(next()%3!==0)carve(1+i*2,62);
      if(next()%3!==0)carve(62,1+i*2);
    }

    // Precisely these two boundary *glyphs* break the external wall.
    // TL remains a wall while TR, BL and BR form one dark connected path.
    for(const opening of openings){
      const p=opening.y*2*width+opening.x*2;
      wall[p]=1;
      wall[p+1]=0;
      wall[p+width]=0;
      wall[p+width+1]=0;
    }

    // One optional interior passage per date bit. All bridge endpoints are
    // already walkable, so activating a bridge can never disconnect the maze.
    // The 32 reserved locations guarantee different numeric dates differ
    // even if their pseudo-random generator seeds accidentally collide.
    const dateBits=(Number(value)^0xA5C39F17)>>>0;
    for(let i=0;i<32;i++){
      if((dateBits>>>(31-i))&1)wall[signatureBridges[i]]=0;
    }

    // Independent 4-neighbor audit of the *dark* walkable area.
    let totalWalkable=0;
    for(const pixel of wall)if(!pixel)totalWalkable++;
    const flooded=new Uint8Array(length),queue=new Uint16Array(length);
    let head=0,tail=1;
    const entrancePixel=(openings[0].y*2)*width+openings[0].x*2+1;
    queue[0]=entrancePixel;flooded[entrancePixel]=1;
    while(head<tail){
      const p=queue[head++],x=p%width,y=(p/width)|0;
      const neighbors=[y>0?p-width:-1,x<width-1?p+1:-1,y<width-1?p+width:-1,x>0?p-1:-1];
      for(const n of neighbors){
        if(n>=0&&!wall[n]&&!flooded[n]){flooded[n]=1;queue[tail++]=n;}
      }
    }
    const secondPixel=(openings[1].y*2)*width+openings[1].x*2+1;
    if(tail!==totalWalkable||!flooded[secondPixel])throw new Error('DATEMARK DISCONNECTED CORRIDOR');
    let boundaryOpenings=0;
    for(let y=0;y<32;y++)for(let x=0;x<32;x++){
      if(x!==0&&x!==31&&y!==0&&y!==31)continue;
      const pixels=cellPixels(x,y);
      const mask=(wall[pixels[0]]?8:0)|(wall[pixels[1]]?4:0)|
        (wall[pixels[2]]?2:0)|(wall[pixels[3]]?1:0);
      const isOpening=openings.some(o=>o.x===x&&o.y===y);
      if(isOpening){
        if(mask!==8)throw new Error('DATEMARK ENTRANCE GLYPH');
        boundaryOpenings++;
      }else if((y===0&&(mask&12)!==12)||(y===31&&(mask&3)!==3)||
        (x===0&&(mask&10)!==10)||(x===31&&(mask&5)!==5)){
        throw new Error('DATEMARK UNINTENDED EDGE OPENING');
      }
    }
    if(boundaryOpenings!==2)throw new Error('DATEMARK ENTRANCE COUNT');

    const chars=[],palette=[],masks=[];
    for(let y=0;y<32;y++){
      let row='';
      for(let x=0;x<32;x++){
        const pixels=cellPixels(x,y);
        const mask=(wall[pixels[0]]?8:0)|(wall[pixels[1]]?4:0)|
          (wall[pixels[2]]?2:0)|(wall[pixels[3]]?1:0);
        if(mask===0)throw new Error('DATEMARK EMPTY CELL');
        row+=glyphs[mask-1];masks.push(mask);
        const cellSeed=(seed^Math.imul(x+1,0x27D4EB2D)^Math.imul(y+1,0x165667B1))>>>0;
        palette.push((makeGenerator(cellSeed)()>>>13)&7);
      }
      chars.push(row);
    }
    return {text:chars.join('\n'),palette,masks};
  }
  function layout(){
    const wrap=matrix.parentElement;
    const availableWidth=wrap.clientWidth;if(!availableWidth)return;
    const rect=wrap.getBoundingClientRect();
    const footer=document.querySelector('.footer');
    const footerHeight=footer.getBoundingClientRect().height||40;
    const room=Math.max(100,window.innerHeight-rect.top-footerHeight-25);
    const side=Math.max(32,Math.min(availableWidth,room-10));
    matrix.style.width=side+'px';
    // The 32 × 32 display remains the same size; quadrant artwork fills cells.
    output.style.fontSize='0px';output.style.lineHeight='0px';
    output.style.letterSpacing='0px';
  }
  function redraw(){
    if(!lastDate)return;
    const result=makeMatrix(lastDate);
    colorIndexes=result.palette;
    const lines=result.text.split('\n');
    const parts=[];
    for(let y=0;y<32;y++){
      for(let x=0;x<32;x++){
        const i=y*32+x;
        const shade=colorful?colors[colorIndexes[i]]:'#c6c8ce',mask=result.masks[i];
        parts.push('<span style="--tl:',mask&8?shade:'transparent',
          ';--tr:',mask&4?shade:'transparent',
          ';--bl:',mask&2?shade:'transparent',
          ';--br:',mask&1?shade:'transparent','">',lines[y][x],'</span>');
      }
      if(y!==31)parts.push('\n');
    }
    output.innerHTML=parts.join('');
    layout();
  }
  generate.addEventListener('click',()=>{
    if(randomMode){
      digits=randomDate();
      randomPending=false;
      source.value=displayDate(digits);
      updateDateOverlay();
    }else if(!validDate(digits)){
      status.textContent='INVALID DATE / YYYYMMDD';
      source.focus();return;
    }
    lastDate=digits;
    try{
      redraw();
      copy.hidden=false;
      status.textContent='DATEMARK / '+digits;
    }catch(error){
      output.replaceChildren();copy.hidden=true;
      lastDate='';
      status.textContent='DATEMARK / CONNECTIVITY ERROR';
      console.error(error);
    }
    updateGenerateLabel();
  });
  clear.addEventListener('click',()=>{
    digits='';
    source.value='';
    randomPending=false;
    previousManualDigits='';
    updateDateOverlay();
    lastDate='';
    colorIndexes=[];
    output.replaceChildren();
    matrix.style.width='';
    copy.hidden=true;
    status.textContent='STANDBY';
    updateGenerateLabel();
    if(!randomMode)source.focus();
  });
  modeButton.addEventListener('click',()=>{
    colorful=!colorful;
    modeButton.textContent='c = '+(colorful?'y':'n');
    modeButton.setAttribute('aria-pressed',String(colorful));
    if(lastDate)redraw();
  });
  copy.addEventListener('click',async()=>{
    const text=output.textContent;if(!text)return;
    let ok=false;
    try{await navigator.clipboard.writeText(text);ok=true;}
    catch(error){
      const temporary=document.createElement('textarea');
      temporary.value=text;temporary.style.position='fixed';temporary.style.opacity='0';
      document.body.appendChild(temporary);temporary.select();
      try{ok=document.execCommand('copy');}catch(ignored){}
      temporary.remove();
    }
    status.textContent=ok?'COPIED / 32 × 32':'COPY FAILED / SELECT MANUALLY';
    if(!ok){
      const range=document.createRange();range.selectNodeContents(output);
      const selection=window.getSelection();selection.removeAllRanges();selection.addRange(range);
    }
  });
  window.addEventListener('resize',layout);
  window.visualViewport?.addEventListener('resize',layout);
  document.fonts?.ready.then(layout);
  updateDateOverlay();
  updateGenerateLabel();
  layout();
})();
</script>
<script>
(()=>{'use strict';
const title=document.getElementById('ink-menu-title');
const menu=document.getElementById('ink-tool-menu');
function openMenu(open){menu.hidden=!open;title.setAttribute('aria-expanded',String(open));}
title.addEventListener('click',()=>openMenu(menu.hidden));
title.addEventListener('keydown',event=>{
  if(event.key==='Enter'||event.key===' '){event.preventDefault();openMenu(menu.hidden);}
});
document.addEventListener('pointerdown',event=>{
  if(!title.contains(event.target)&&!menu.contains(event.target))openMenu(false);
});
document.addEventListener('keydown',event=>{
  if(event.key==='Escape'&&!menu.hidden){openMenu(false);title.focus();}
});
})();
</script></body></html>
